<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="YRRh6jvBiPgsqxbRXpFUyRfganm4lP1V1yTXE7MvlhQ">

<title>Humans Together</title>

<style>

/* ===== MOBILE FIRST ===== */

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f5f7fa;
  color:#1f2937;
}

/* ===== PAGE WRAPPER ===== */

.wrapper{
  max-width:700px;
  margin:auto;
  padding:20px 16px 40px;
}

/* ===== HEADER ===== */

h1{
  margin:0;
  font-size:28px;
  text-align:center;
}

.tagline{
  text-align:center;
  color:#10b981;
  margin-top:6px;
  margin-bottom:18px;
  font-weight:600;
}

.description{
  text-align:center;
  color:#6b7280;
  margin-bottom:24px;
  font-size:15px;
}

/* ===== BUTTONS ===== */

button{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
  font-weight:600;
}

.help{ background:#10b981; color:white; }
.help:hover{ background:#059669; }

.offer{ background:#2563eb; color:white; }
.offer:hover{ background:#1d4ed8; }

.activityBtn{
  background:#e5e7eb;
  color:#111827;
}

/* ===== CARDS ===== */

.card{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-top:18px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.card h3{
  margin-top:0;
  font-size:16px;
}

/* ===== ACTIVITY ===== */

.feed-item{
  padding:8px 0;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
}

.feed-item:last-child{
  border-bottom:none;
}

.status{
  font-size:12px;
  color:#10b981;
}

/* ===== FOOTER ===== */

footer{
  margin-top:30px;
  text-align:center;
  font-size:12px;
  color:#9ca3af;
}

/* ===== DESKTOP ===== */

@media(min-width:700px){

.wrapper{
  padding-top:40px;
}

h1{
  font-size:36px;
}

}

</style>
</head>

<body>

<div class="wrapper">

<h1>Humans Together</h1>
<div class="tagline">Together we help</div>

<div class="description">
A global space where people connect and support each other.
</div>

<button class="help" onclick="location.href='help.html'">I need help</button>
<button class="offer" onclick="location.href='offer.html'">I want to help</button>
<button class="activityBtn" onclick="location.href='activity.html'">Community activity</button>

<!-- COMMUNITY SUPPORT -->
<div class="card">
<h3>Community Support</h3>
Humans Together is supported by independent community initiatives.
<br><br>
<a href="https://ligone-token.github.io/ligone-web/"
style="color:#2563eb;font-weight:600;text-decoration:none;">
Learn about LIGONE LIG1 →
</a>
</div>

<!-- LIVE ACTIVITY -->
<div class="card">
<h3>Live Community Activity</h3>
<div id="feed"></div>
</div>

<footer>
A global human support network
</footer>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
"https://hwpeegcsdgxgcybuosfv.supabase.co",
"sb_publishable_LhuHoUS_DR4o2Pp3aqbNBw_IXwHo2fD"
);

async function loadActivity(){

 const { data } = await supabase
  .from("humans.posts")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(5);

 const feed=document.getElementById("feed");
 feed.innerHTML="";

 data?.forEach(post=>{

  const type =
    post.type==="help_request"
    ? "Help requested"
    : "Help offered";

  const div=document.createElement("div");
  div.className="feed-item";

  div.innerHTML=`
    <strong>${post.region || "Unknown location"}</strong><br>
    ${post.title || ""}
    <div class="status">${type}</div>
  `;

  feed.appendChild(div);
 });
}

loadActivity();
</script>

</body>
</html>
