<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="YRRh6jvBiPgsqxbRXpFUyRfganm4lP1V1yTXE7MvlhQ" />

<title>Humans Together | Global Human Support Network</title>
<meta name="description" content="Humans Together connects people worldwide to request help, offer support, and build trusted human connections." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://ligone-token.github.io/humans-together/" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Humans Together" />
<meta property="og:description" content="Global human support network." />
<meta property="og:image" content="https://ligone-token.github.io/humans-together/og-image.png" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
body{margin:0;font-family:system-ui;background:#f6f8fb}
.wrap{max-width:760px;margin:auto;padding:20px}
.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:12px}
.hidden{display:none}
</style>

</head>
<body>

<div class="wrap">

<h1>Humans Together</h1>

<button onclick="view('login')">Login</button>
<button onclick="view('help')">Need help</button>
<button onclick="view('offer')">Offer help</button>

<div id="login" class="hidden">
<input id="email" placeholder="Email">
<button onclick="login()">Login</button>
</div>

<div id="help" class="hidden">
<input id="helpText">
<button onclick="post('HELP',helpText.value)">Send</button>
</div>

<div id="offer" class="hidden">
<input id="offerText">
<button onclick="post('OFFER',offerText.value)">Send</button>
</div>

<div class="card">
<h3>Community</h3>
<div id="feed"></div>
</div>

</div>

<script>

const feed=document.getElementById("feed")
const email=document.getElementById("email")
const helpText=document.getElementById("helpText")
const offerText=document.getElementById("offerText")

function view(id){
["login","help","offer"].forEach(v=>document.getElementById(v).classList.add("hidden"))
document.getElementById(id).classList.remove("hidden")
}

let user=null

async function init(){
const {data}=await sb.auth.getUser()
user=data?.user||null
render()
}
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;render()})

async function login(){
await sb.auth.signInWithOtp({email:email.value,options:{emailRedirectTo:location.href}})
alert("Check email")
}

async function post(type,text){
if(!user)return view("login")
await sb.from("posts").insert({type,text,user_id:user.id,user_email:user.email})
await sb.rpc("increment_trust",{uid:user.id,mail:user.email}).catch(()=>{})
render()
}

async function render(){
const {data}=await sb.from("posts").select("*").order("created_at",{ascending:false})
feed.innerHTML=""
data?.forEach(p=>{
feed.innerHTML+=`<div>${p.type}: ${p.text} (${p.user_email})</div>`
})
}

init()

</script>

</body>
</html>
