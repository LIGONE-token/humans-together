<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification"
content="YRRh6jvBiPgsqxbRXpFUyRfganm4lP1V1yTXE7MvlhQ" />

<title>Humans Together | Global Human Support Network</title>
<meta name="description" content="Global community platform where people request help, offer support and build trust.">
<meta name="robots" content="index, follow">

<style>
body{margin:0;font-family:system-ui;background:#f6f8fb;color:#111827}
.wrap{max-width:760px;margin:40px auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-top:20px}
button{padding:12px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer;margin-top:10px}
button.gray{background:#e5e7eb;color:#111827}
input,select{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #d1d5db}
nav button{margin-right:10px}
.hidden{display:none}
.feed-item{padding:10px 0;border-bottom:1px solid #e5e7eb}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:6px}
.trust-low{background:#fee2e2;color:#991b1b}
.trust-mid{background:#fef3c7;color:#92400e}
.trust-high{background:#dcfce7;color:#166534}
</style>

</head>
<body>

<div class="wrap">

<nav>
<button onclick="view('home')">Home</button>
<button onclick="view('activity')">Activity</button>
<button onclick="view('help')">Request Help</button>
<button onclick="view('offer')">Offer Help</button>
<button onclick="view('dashboard')">Dashboard</button>
<button onclick="view('login')">Login</button>
</nav>

<!-- HOME -->
<div id="home" class="page">
<h1>Humans Together</h1>
<p>Global human support platform connecting people in real life.</p>

<div class="card">
<b>Total Users:</b> <span id="userCount">0</span><br>
<b>Total Posts:</b> <span id="postCount">0</span>
</div>

<div class="card">
<h2>Recent Activity</h2>
<div id="homeFeed"></div>
</div>
</div>

<!-- LOGIN -->
<div id="login" class="page hidden">
<div class="card">
<h2>Login</h2>
<input id="email" placeholder="Email">
<button onclick="login()">Enter</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page hidden">
<div class="card" id="profile"></div>
</div>

<!-- HELP -->
<div id="help" class="page hidden">
<div class="card">
<h2>Request Help</h2>
<input id="helpText" placeholder="Describe your request">
<button onclick="createPost('HELP')">Publish</button>
</div>
</div>

<!-- OFFER -->
<div id="offer" class="page hidden">
<div class="card">
<h2>Offer Help</h2>
<input id="offerText" placeholder="Describe your offer">
<button onclick="createPost('OFFER')">Publish</button>
</div>
</div>

<!-- ACTIVITY -->
<div id="activity" class="page hidden">
<div class="card">
<h2>Community Activity</h2>

<input id="search" placeholder="Search..." oninput="renderPosts()">

<select id="filter" onchange="renderPosts()">
<option value="ALL">All</option>
<option value="HELP">Help Requests</option>
<option value="OFFER">Help Offers</option>
</select>

<div id="feed"></div>
</div>
</div>

</div>

<script>

/* ---------- STORAGE ---------- */

function users(){return JSON.parse(localStorage.getItem("users")||"{}")}
function posts(){return JSON.parse(localStorage.getItem("posts")||"[]")}
function saveUsers(v){localStorage.setItem("users",JSON.stringify(v))}
function savePosts(v){localStorage.setItem("posts",JSON.stringify(v))}

/* ---------- NAV ---------- */

function view(id){
document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"))
document.getElementById(id).classList.remove("hidden")
}

/* ---------- LOGIN ---------- */

function login(){
let u=email.value.trim()
if(!u) return

let db=users()
if(!db[u]) db[u]={trust:0}
saveUsers(db)

localStorage.setItem("user",u)
updateProfile()
updateStats()
view("dashboard")
}

/* ---------- PROFILE ---------- */

function trustLabel(score){
if(score>=10) return `<span class="badge trust-high">HIGH TRUST</span>`
if(score>=5) return `<span class="badge trust-mid">TRUSTED</span>`
return `<span class="badge trust-low">NEW</span>`
}

function updateProfile(){
let u=localStorage.getItem("user")
if(!u) return
let db=users()

profile.innerHTML=`
<h2>Profile</h2>
Email: ${u}<br>
Reputation: ${db[u].trust} ${trustLabel(db[u].trust)}
<br><br>
<button onclick="increaseTrust()">Increase Trust</button>
<button class="gray" onclick="logout()">Logout</button>
`
}

function increaseTrust(){
let u=localStorage.getItem("user")
let db=users()
db[u].trust++
saveUsers(db)
updateProfile()
}

/* ---------- POSTS ---------- */

function createPost(type){
let u=localStorage.getItem("user")
if(!u){view("login");return}

let text = type==="HELP" ? helpText.value : offerText.value
if(!text.trim()) return

let list=posts()
list.unshift({
user:u,
type,
text,
time:new Date().toLocaleString()
})
savePosts(list)

let db=users()
db[u].trust++
saveUsers(db)

renderPosts()
updateProfile()
updateStats()
alert("Posted")
}

/* ---------- RENDER ---------- */

function renderPosts(){
let list=posts()
let q=search.value.toLowerCase()
let f=filter.value

feed.innerHTML=""
homeFeed.innerHTML=""

list.forEach(p=>{
if(f!=="ALL" && p.type!==f) return
if(q && !p.text.toLowerCase().includes(q)) return

let trust=users()[p.user]?.trust||0

let html=`
<div class="feed-item">
<b>${p.type}</b> — ${p.text}<br>
<small>${p.time}</small><br>
User: ${p.user} ${trustLabel(trust)}
</div>`

feed.innerHTML+=html
homeFeed.innerHTML+=html
})
}

/* ---------- STATS ---------- */

function updateStats(){
userCount.innerText=Object.keys(users()).length
postCount.innerText=posts().length
}

/* ---------- LOGOUT ---------- */

function logout(){
localStorage.removeItem("user")
location.reload()
}

/* ---------- INIT ---------- */

updateProfile()
renderPosts()
updateStats()

</script>
</body>
</html>
