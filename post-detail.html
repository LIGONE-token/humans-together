<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post | Humans Together</title>
<style>
body{margin:0;background:#0b0e11;color:#e5e7eb;font-family:system-ui;padding:20px}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
a.btn{display:inline-block;padding:10px 14px;border-radius:12px;background:#111827;color:#e5e7eb;text-decoration:none}
.card{max-width:900px;margin:auto;background:#111827;border-radius:14px;padding:20px}
h1{margin:0 0 8px}
.meta{color:#9ca3af;margin:6px 0 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{padding:12px 14px;border:0;border-radius:12px;cursor:pointer;font-weight:900}
.green{background:#10b981;color:#fff}
.blue{background:#3b82f6;color:#fff}
.gray{background:#1f2937;color:#fff}
#status{margin-top:12px;font-weight:800;color:#9ca3af}
</style>
</head>
<body>

<div class="top">
  <a class="btn" href="activity.html">← Activity</a>
  <a class="btn" href="post-create.html">Create</a>
  <a class="btn" href="login.html">Login</a>
  <a class="btn" href="dashboard.html">Dashboard</a>
</div>

<div class="card">
  <h1 id="t"></h1>
  <div id="d"></div>
  <div class="meta">
    <span id="r"></span> • Status: <strong id="s"></strong>
  </div>

  <div class="actions">
    <button class="green" onclick="offerHelp()">I can help</button>
    <button class="blue" onclick="markCompleted()">Mark completed</button>
    <button class="gray" onclick="giveTrust()">Give trust</button>
  </div>

  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  "https://hwpeegcsdgxgcybuosfv.supabase.co",
  "sb_publishable_LhuHoUS_DR4o2Pp3aqbNBw_IXwHo2fD"
);

const id = new URLSearchParams(location.search).get("id");
const statusEl = document.getElementById("status");

async function load(){
  statusEl.textContent = "Loading…";
  const { data, error } = await supabase
    .schema("humans").from("posts")
    .select("*")
    .eq("id", id)
    .single();

  if(error){
    statusEl.textContent = "ERROR: " + error.message;
    return;
  }

  document.getElementById("t").textContent = data.title || "";
  document.getElementById("d").textContent = data.description || "";
  document.getElementById("r").textContent = data.region || "";
  document.getElementById("s").textContent = data.status || "OPEN";
  statusEl.textContent = "";
}
load();

async function needLogin(){
  const { data:{ user } } = await supabase.auth.getUser();
  if(!user){ location.href="login.html"; return null; }
  return user;
}

async function offerHelp(){
  const user = await needLogin();
  if(!user) return;

  statusEl.textContent="Saving helper…";

  // participant table optional: if not present, this will show error text (not silent)
  const { error: pe } = await supabase.schema("humans").from("post_participants")
    .insert({ post_id:id, user_id:user.id, role:"helper" });

  if(pe){ statusEl.textContent="ERROR: "+pe.message; return; }

  const { error: se } = await supabase.schema("humans").from("posts")
    .update({ status:"IN_PROGRESS" })
    .eq("id", id);

  if(se){ statusEl.textContent="ERROR: "+se.message; return; }

  statusEl.textContent="Saved ✔";
  load();
}

async function markCompleted(){
  const user = await needLogin();
  if(!user) return;

  statusEl.textContent="Completing…";

  const { error } = await supabase.schema("humans").from("posts")
    .update({ status:"COMPLETED" })
    .eq("id", id);

  statusEl.textContent = error ? ("ERROR: "+error.message) : "Completed ✔";
  load();
}

async function giveTrust(){
  const user = await needLogin();
  if(!user) return;

  const rating = prompt("Trust rating 1–5");
  if(!rating) return;

  statusEl.textContent="Saving trust…";

  const { error } = await supabase.schema("humans").from("trust_ratings")
    .insert({ post_id:id, from_user:user.id, rating: parseInt(rating,10) });

  statusEl.textContent = error ? ("ERROR: "+error.message) : "Trust saved ✔";
}
</script>
</body>
</html>
