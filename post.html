<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post | Humans Together</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#0b0e11;
  color:#e5e7eb;
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

.container{
  max-width:600px;
  width:100%;
}

input, textarea, select{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  background:#111827;
  color:white;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#10b981;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#059669;
}
</style>
</head>

<body>

<div class="container">

<h1>Create Post</h1>

<select id="type">
  <option value="help_request">I need help</option>
  <option value="help_offer">I want to help</option>
</select>

<input id="title" placeholder="Short title">
<textarea id="description" placeholder="Describe the situation"></textarea>
<input id="region" placeholder="City / Country">

<button onclick="createPost()">Publish</button>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://hwpeegcsdgxgcybuosfv.supabase.co",
  "sb_publishable_LhuHoUS_DR4o2Pp3aqbNBw_IXwHo2fD"
);
</script>


<script>
async function createPost(){

  const { data:{ user } } = await supabase.auth.getUser();

  if(!user){
    alert("Please login first");
    return;
  }

  const type = document.getElementById("type").value;
  const title = document.getElementById("title").value;
  const description = document.getElementById("description").value;
  const region = document.getElementById("region").value;

  const { error } = await supabase
    .from("humans.posts")
    .insert({
      user_id: user.id,
      type,
      title,
      description,
      region
    });

  if(error){
    alert(error.message);
    return;
  }

  alert("Post created!");
  window.location.href = "activity.html";
}
</script>

</body>
</html>
