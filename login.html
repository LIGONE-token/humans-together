<!DOCTYPE html>
<html>
<body style="background:#0b0e11;color:white;font-family:system-ui;padding:30px">

<h2>Login</h2>

<input id="email" placeholder="Email" style="padding:12px;width:260px">
<button onclick="login()" style="padding:12px">Send login link</button>

<p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
"https://hwpeegcsdgxgcybuosfv.supabase.co",
"sb_publishable_LhuHoUS_DR4o2Pp3aqbNBw_IXwHo2fD"
);

async function login(){
const { error } = await supabase.auth.signInWithOtp({
email:email.value,
options:{emailRedirectTo:location.origin}
});
msg.textContent = error ? error.message : "Check email";
}
</script>

</body>
</html>
