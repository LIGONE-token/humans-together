<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I need help - Humans Together</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#0b0e11;
  color:#e5e7eb;
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

.container{
  max-width:600px;
  width:100%;
}

h1{
  text-align:center;
  margin-bottom:10px;
}

p{
  text-align:center;
  color:#9ca3af;
  margin-bottom:30px;
}

input, textarea{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  background:#111827;
  color:white;
  font-size:15px;
}

button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#10b981;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#059669;
}

.back{
  margin-top:20px;
  text-align:center;
  color:#9ca3af;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>I need help</h1>
<p>Tell us what you need. People around the world may support you.</p>

<form action="https://formspree.io/f/mzdarray" method="POST">

  <input type="hidden" name="_redirect" value="https://ligone-token.github.io/humans-together/thank-you.html">
<input type="hidden" name="type" value="help_request">

<input type="text" name="name" placeholder="Your name or nickname" required>

<input type="text" name="location" placeholder="Country / City" required>

<textarea name="message" rows="6" placeholder="Describe what you need help with..." required></textarea>

<button type="submit">Send request</button>

</form>

<div class="back" onclick="location.href='index.html'">
← Back to Humans Together
</div>

</div>

</body>
</html>
