<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Activity</title>

<style>
body{
background:#0b0e11;
color:white;
font-family:system-ui;
padding:20px;
margin:0;
}

.card{
background:#111827;
padding:16px;
margin-bottom:12px;
border-radius:10px;
}

.type{
font-size:12px;
opacity:0.7;
margin-top:6px;
}

#status{
margin-bottom:15px;
font-weight:600;
}
</style>
</head>

<body>

<h1>Community Activity</h1>
<div id="status">Loading...</div>
<div id="feed"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
"https://hwpeegcsdgxgcybuosfv.supabase.co",
"sb_publishable_LhuHoUS_DR4o2Pp3aqbNBw_IXwHo2fD"
);

const feed = document.getElementById("feed");
const statusBox = document.getElementById("status");

async function loadPosts(){

statusBox.textContent="Loading posts...";

const { data, error } = await supabase
.schema("humans")
.from("posts")
.select("*")
.order("created_at",{ascending:false});

if(error){
statusBox.textContent="ERROR: " + error.message;
return;
}

if(!data || data.length===0){
statusBox.textContent="No posts yet";
return;
}

statusBox.textContent="";

data.forEach(post=>{

const div = document.createElement("div");
div.className="card";

div.innerHTML = `
<strong>${post.title || ""}</strong><br>
${post.description || ""}<br>
<small>${post.region || ""}</small>
<div class="type">${post.type}</div>
`;

feed.appendChild(div);

});
}

loadPosts();
</script>

</body>
</html>
