<!DOCTYPE html>
<html>
<body>
<h1>Community Activity</h1>
<div id="feed"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const supabase=window.supabaseClient;
(async()=>{
const {data}=await supabase.schema("humans").from("posts")
.select("title,region").order("created_at",{ascending:false});
data.forEach(p=>{
const d=document.createElement("div");
d.innerHTML="<b>"+(p.region||"")+"</b> "+p.title;
feed.appendChild(d);
});
})();
</script>
</body>
</html>
