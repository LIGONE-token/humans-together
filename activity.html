<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Activity | Humans Together</title>

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#0b0e11;
  color:#e5e7eb;
  padding:40px 20px;
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#9ca3af;
  margin-bottom:30px;
}

.feed{
  background:#111827;
  border-radius:14px;
  padding:20px;
}

.item{
  padding:16px;
  border-bottom:1px solid #1f2933;
}

.item:last-child{
  border-bottom:none;
}

.type{
  font-size:12px;
  font-weight:600;
  margin-bottom:5px;
}

.help{
  color:#f87171;
}

.offer{
  color:#60a5fa;
}

.location{
  font-size:13px;
  color:#9ca3af;
  margin-bottom:5px;
}

.text{
  margin-bottom:6px;
}

.time{
  font-size:12px;
  color:#6b7280;
}

.back{
  margin-top:25px;
  text-align:center;
  cursor:pointer;
  color:#9ca3af;
}
</style>
</head>

<body>

<div class="container">

<h1>Community Activity</h1>
<div class="subtitle">Real people. Real needs. Real support.</div>

<div class="feed" id="feed"></div>

<div class="back" onclick="location.href='index.html'">
← Back to Humans Together
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "DEINE_PROJECT_URL",
  "DEIN_ANON_KEY"
);

async function loadPosts(){

  const { data, error } = await supabase
    .from("humans.posts")
    .select("*")
    .order("created_at", { ascending:false });

  if(error){
    console.error(error);
    return;
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.forEach(post=>{

    const div = document.createElement("div");
    div.className = "item";

    const typeLabel =
    post.type === "help_request"
    ? '<div class="type help">HELP REQUEST</div>'
    : '<div class="type offer">HELP OFFER</div>';

    div.innerHTML = `
      ${typeLabel}
      <div class="location">${post.region || ""}</div>
      <div class="text">${post.title || ""}<br>${post.description || ""}</div>
      <div class="time">${new Date(post.created_at).toLocaleString()}</div>
    `;

    feed.appendChild(div);

  });

}

loadPosts();
</script>

</script>

</body>
</html>
