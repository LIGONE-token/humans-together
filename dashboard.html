<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Humans Together</title>
<style>
body{margin:0;background:#0b0e11;color:#e5e7eb;font-family:system-ui;padding:20px}
a.btn{display:inline-block;padding:10px 14px;border-radius:12px;background:#111827;color:#e5e7eb;text-decoration:none;margin-right:8px}
.card{max-width:900px;margin:auto;background:#111827;border-radius:14px;padding:20px}
.item{padding:12px;border-radius:12px;background:#0f172a;margin:10px 0;cursor:pointer}
.item:hover{background:#1f2937}
.small{color:#9ca3af;font-size:13px}
#status{margin-top:12px;font-weight:800;color:#9ca3af}
</style>
</head>
<body>

<div style="margin-bottom:14px">
  <a class="btn" href="index.html">Home</a>
  <a class="btn" href="activity.html">Activity</a>
  <a class="btn" href="post-create.html">Create</a>
  <a class="btn" href="logout.html">Logout</a>
</div>

<div class="card">
  <h1 style="margin:0 0 6px">My Dashboard</h1>
  <div class="small">Your posts (login required)</div>
  <div id="status">Loading…</div>
  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  "https://hwpeegcsdgxgcybuosfv.supabase.co",
  "sb_publishable_LhuHoUS_DR4o2Pp3aqbNBw_IXwHo2fD"
);

const statusEl = document.getElementById("status");
const list = document.getElementById("list");

async function load(){
  const { data:{ user } } = await supabase.auth.getUser();
  if(!user){ location.href="login.html"; return; }

  const { data, error } = await supabase.schema("humans").from("posts")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at",{ascending:false});

  if(error){ statusEl.textContent="ERROR: "+error.message; return; }
  if(!data || data.length===0){ statusEl.textContent="No posts yet."; return; }

  statusEl.textContent="";
  data.forEach(p=>{
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`<strong>${p.title||""}</strong><div class="small">${p.region||""} • ${p.status||"OPEN"}</div>`;
    div.onclick=()=>location.href="post-detail.html?id="+p.id;
    list.appendChild(div);
  });
}
load();
</script>
</body>
</html>
