<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Humans Together</title>
<style>
body{margin:0;background:#0b0e11;color:#e5e7eb;font-family:system-ui;padding:20px}
a.btn{display:inline-block;padding:10px 14px;border-radius:12px;background:#111827;color:#e5e7eb;text-decoration:none;margin-right:8px}
.card{max-width:720px;margin:auto;background:#111827;border-radius:14px;padding:20px}
#status{margin-top:10px;font-weight:800;color:#9ca3af}
</style>
</head>
<body>

<div style="margin-bottom:14px">
  <a class="btn" href="index.html">Home</a>
  <a class="btn" href="dashboard.html">Dashboard</a>
  <a class="btn" href="logout.html">Logout</a>
</div>

<div class="card">
  <h1 style="margin:0 0 6px">My Profile</h1>
  <div id="status">Loading…</div>
  <div id="info"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  "https://hwpeegcsdgxgcybuosfv.supabase.co",
  "sb_publishable_LhuHoUS_DR4o2Pp3aqbNBw_IXwHo2fD"
);

const statusEl = document.getElementById("status");
const info = document.getElementById("info");

async function load(){
  const { data:{ user } } = await supabase.auth.getUser();
  if(!user){ location.href="login.html"; return; }

  statusEl.textContent="";
  info.innerHTML = `<p><strong>Email:</strong> ${user.email}</p>
                    <p style="color:#9ca3af">Trust badges & profile edit can be added on top — this is stable base.</p>`;
}
load();
</script>
</body>
</html>
